name: Regenerar páginas SEO

on:
  schedule:
    - cron: '0 */3 * * *'   # cada 3 horas
  workflow_dispatch:         # botón manual en GitHub → Actions
  repository_dispatch:
    types: [productos-actualizados]  # disparo instantáneo desde Supabase (opcional)

permissions:
  contents: write

concurrency:
  group: regenerar-seo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Commit si hay cambios
        run: |
          git config user.name "ciledreams-bot"
          git config user.email "bot@ciledreams.com.ar"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: regenerar páginas SEO desde Supabase"
            git push
          fi
